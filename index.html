<style>
:root{
  --bg:#f4f3fb; --surface:#ffffff; --surface2:#eceaf8; --text:#171a2e; --muted:#5d6486;
  --accent:#5b3df0; --on-accent:#ffffff; --line:#dcd9ef; --danger:#c0233f;
  --display:'Bricolage Grotesque','Avenir Next','Trebuchet MS',sans-serif;
  --body:'DM Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1322; --surface:#171e33; --surface2:#212a45; --text:#eef1fa; --muted:#98a2c0;
    --accent:#8a6dff; --on-accent:#0e1322; --line:#2a3454; --danger:#ff7a93;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#171e33; --surface2:#212a45; --text:#eef1fa; --muted:#98a2c0;
  --accent:#8a6dff; --on-accent:#0e1322; --line:#2a3454; --danger:#ff7a93;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}
.ic-fill{fill:currentColor}
.ic-line{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{max-width:640px;margin:0 auto;padding:18px 16px 140px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:1.65rem;letter-spacing:-.02em;margin:0;line-height:1.05;white-space:nowrap}
.pill{background:var(--accent);color:var(--on-accent);font-weight:600;padding:10px 16px;border-radius:999px;font-size:.95rem;white-space:nowrap}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
#search{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
#search::placeholder{color:var(--muted)}
.tabs{display:flex;gap:6px}
.tabs button{padding:8px 16px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:500}
.tabs button.on{background:var(--text);color:var(--bg)}
#notice{background:var(--surface2);border-radius:12px;padding:10px 14px;font-size:.9rem;color:var(--muted);margin-bottom:12px}
#plHead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#plHead h2{flex:1;min-width:0;margin:0;font-family:var(--display);font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.cover{flex:none;width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:1.1rem;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cover svg{width:22px;height:22px}
.meta{min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.now .t{color:var(--accent)}
.row.now .cover{box-shadow:0 0 0 3px var(--accent)}
.dur{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn.on{color:var(--accent)}
.newrow{display:flex;justify-content:center;padding:6px 0 12px}
#empty{text-align:center;padding:48px 16px;color:var(--muted)}
#empty strong{display:block;font-family:var(--display);font-size:1.35rem;color:var(--text);margin-bottom:6px}
#empty .pill{display:inline-block;margin-top:16px}

#mini{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:5}
#mini .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
#mini .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
#mini .bar{position:absolute;left:0;top:0;height:3px;background:var(--accent);width:0}
.play-sm{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.play-sm svg{width:24px;height:24px}

#full{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
#full .wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:18px}
#full .head{width:100%;display:flex;justify-content:space-between;align-items:center}
.disc{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;position:relative;margin-top:8px;
  background:repeating-radial-gradient(circle at center,#0b0d16 0 2px,#151927 2px 4px);
  box-shadow:0 18px 40px rgba(0,0,0,.35);animation:spin 9s linear infinite;animation-play-state:paused}
.disc.spin{animation-play-state:running}
.disc .label{position:absolute;inset:30%;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:2.6rem;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.disc .hole{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.disc{animation:none}}
#lyrics{position:relative;width:100%;height:min(46vh,340px);overflow-y:auto;text-align:center;padding:4px 6px}
#lyrics .ln{margin:0 0 .6em;color:var(--muted);font-family:var(--display);font-size:var(--lyr,1.15rem);line-height:1.35;transition:color .2s}
#lyrics .ln.on{color:var(--text);font-weight:700}
#lyrics .ln.seekable{cursor:pointer}
#lyrics .plain{margin:0 0 .35em;font-size:calc(var(--lyr,1.15rem)*.9);line-height:1.5;min-height:.7em}
#lyrics .none{color:var(--muted);padding:40px 12px}
#lyrics .none .pill{display:inline-block;margin-top:14px}
.info{text-align:center;width:100%}
.info .t{font-family:var(--display);font-size:1.5rem;font-weight:700;letter-spacing:-.01em;white-space:normal;line-height:1.2}
.info .a{font-size:1rem;margin-top:2px}
.seek{width:100%}
#seek{width:100%;accent-color:var(--accent);height:28px}
.times{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:space-between;width:100%}
.ctrl .big{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ctrl .big svg{width:34px;height:34px}
.ctrl .icon-btn{width:48px;height:48px}
.ctrl .icon-btn svg{width:26px;height:26px}
.badge{position:relative}
.badge i{position:absolute;right:6px;top:6px;font-style:normal;font-size:.7rem;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:999px;width:16px;height:16px;display:grid;place-items:center}

#layer{position:fixed;inset:0;z-index:20}
#sheetBg{position:absolute;inset:0;background:rgba(5,8,20,.55)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;
  max-height:85%;overflow-y:auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}

.sbtn .chk{color:var(--accent);font-weight:700}

.hint{font-size:.88rem;color:var(--muted);margin:4px 0 8px}
.srow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ghost{background:var(--surface2);color:var(--text);font-weight:600;padding:10px 16px;border-radius:999px;font-size:.95rem}
.tabs .gear{margin-left:auto;padding:0;background:none;color:var(--muted)}
#sheet h4{margin:18px 0 4px;font-family:var(--display);font-size:1.05rem}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.seg button{padding:8px 14px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.seg .sw{width:38px;height:38px;padding:0;border-radius:50%;border:3px solid transparent;background-clip:padding-box;box-shadow:0 0 0 1px var(--line)}
.seg .sw.on{border-color:var(--text)}
.eqrow{display:grid;grid-template-columns:76px 1fr 56px;align-items:center;gap:8px;font-size:.9rem;margin:6px 0}
.eqrow small{color:var(--muted)}
.eqrow input[type=range]{width:100%;accent-color:var(--accent)}
.eqv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.chkrow{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:500}
.chkrow input{width:20px;height:20px;accent-color:var(--accent)}
body.nospin .disc{animation:none}
.disc.sleeve{border-radius:22px;background:none;animation:none}
.disc.sleeve .label{inset:0;border-radius:22px;font-size:5rem}
.disc.sleeve .hole{display:none}
#eq{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
#eq .wrap{max-width:520px;margin:0 auto}
.eqhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.eqhead h2{font-family:var(--display);font-size:1.3rem;margin:0;color:var(--accent)}
.tgl{-webkit-appearance:none;appearance:none;width:56px;height:32px;border-radius:16px;background:var(--surface2);position:relative;cursor:pointer;flex:none;border:0;margin:0;transition:background .15s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s}
.tgl:checked{background:var(--accent)}
.tgl:checked::after{transform:translateX(24px)}
@media (prefers-reduced-motion: reduce){.tgl,.tgl::after{transition:none}}
.eqbands{display:flex;justify-content:space-between;margin:14px 0 8px}
.eqb{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.trk{position:relative;width:100%;max-width:34px;height:240px;touch-action:none;cursor:pointer}
.trk::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:3px;background:var(--surface2)}
.trk .fill{position:absolute;left:50%;width:6px;margin-left:-3px;border-radius:3px;background:var(--accent)}
.trk .zero{position:absolute;left:-3px;right:-3px;top:50%;height:1px;background:var(--muted);opacity:.6}
.trk .thumb{position:absolute;left:50%;width:26px;height:34px;margin:-17px 0 0 -13px;border-radius:7px;background:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.trk .thumb::after{content:'';position:absolute;left:5px;right:5px;top:50%;height:3px;margin-top:-1px;border-radius:2px;background:var(--accent)}
#eq.off .eqbands,#eq.off .card{opacity:.45}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 10px}
.sechead h3{font-family:var(--display);font-size:1.35rem;margin:0}
.outline{border:1.5px solid var(--accent);color:var(--accent);border-radius:10px;padding:7px 12px;font-size:.9rem;font-weight:500}
.saverow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.saverow .field{margin:0;flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;padding:12px 18px;border-radius:14px;background:var(--surface);color:var(--text);font-weight:500}
.chips button.on{background:var(--accent);color:var(--on-accent)}
.card{background:var(--surface);border-radius:20px;padding:16px 18px;margin:14px 0}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:1.15rem;font-weight:700;margin-bottom:6px}
.cardhead span:last-child{font-family:var(--body);font-weight:400;color:var(--muted);font-size:1rem}
.card input[type=range]{width:100%;accent-color:var(--accent);height:30px}
[hidden]{display:none !important}
</style>

<body>
<main>
  <header class="top">
    <div class="brand">
      <h1>Ma Musique</h1>
    </div>
    <button class="pill" id="addBtn" type="button" aria-label="Ajouter des titres">+ Ajouter</button>

  <div id="notice" hidden></div>
  <div class="tools">
    <input id="search" type="search" placeholder="Rechercher un titre ou un artiste" aria-label="Rechercher">
    <div class="tabs">
      <button type="button" data-view="all" class="on">Titres</button>
      <button type="button" data-view="fav">Favoris</button>
      <button type="button" data-view="pl">Playlists</button>
      <button type="button" class="icon-btn gear" id="gearBtn" aria-label="Réglages"></button>
    </div>
  </div>
  <div id="plHead" hidden>
    <button class="icon-btn" type="button" data-act="back" aria-label="Retour aux playlists" id="plBack"></button>
    <h2 id="plTitle"></h2>
    <button class="icon-btn" type="button" data-act="plmore" aria-label="Modifier la playlist" id="plEdit"></button>
  </div>
  <ul id="list"></ul>
  <div id="empty" hidden></div>
</main>

<input type="file" id="file" accept=".mp3,.m4a,.aac,.wav,.ogg,.opus,.flac,.aiff,.aif,.caf" multiple hidden>
<input type="file" id="lrcFile" accept=".lrc,.txt,text/plain" hidden>
<input type="file" id="imgFile" accept="image/*" hidden>

<div id="mini" hidden>
  <div class="bar" id="miniBar"></div>
  <div class="inner">
    <button class="open" id="miniOpen" type="button" aria-label="Ouvrir le lecteur">
      <div class="cover" id="miniCover"></div>
      <div class="meta"><div class="t" id="miniTitle"></div><div class="a" id="miniArtist"></div></div>
    </button>
    <button class="play-sm" id="miniPlay" type="button" aria-label="Lecture / pause"></button>
  </div>
</div>

<section id="full" hidden aria-label="Lecteur">
  <div class="wrap">
    <div class="head">
      <button class="icon-btn" id="closeFull" type="button" aria-label="Réduire le lecteur"></button>
      <button class="icon-btn" id="eqBtn" type="button" aria-label="Égaliseur"></button>
      <button class="icon-btn" id="lyrBtn" type="button" aria-label="Afficher les paroles"></button>
      <button class="icon-btn" id="favFull" type="button" aria-label="Ajouter aux favoris"></button>
    </div>
    <div class="disc" id="disc"><div class="label" id="discLabel"></div><div class="hole"></div></div>
    <div id="lyrics" hidden></div>
    <div class="info"><div class="t" id="fTitle"></div><div class="a" id="fArtist"></div></div>
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position dans le titre">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="ctrl">
      <button class="icon-btn" id="shuffleBtn" type="button" aria-label="Lecture aléatoire"></button>
      <button class="icon-btn" id="prevBtn" type="button" aria-label="Titre précédent"></button>
      <button class="big" id="playBtn" type="button" aria-label="Lecture / pause"></button>
      <button class="icon-btn" id="nextBtn" type="button" aria-label="Titre suivant"></button>
      <button class="icon-btn badge" id="repeatBtn" type="button" aria-label="Répéter"></button>
    </div>
  </div>
</section>

<section id="eq" hidden aria-label="Égaliseur">
  <div class="wrap">
    <div class="eqhead">
      <button class="icon-btn" id="eqClose" type="button" aria-label="Fermer l'égaliseur"></button>
      <h2>Égaliseur</h2>
      <input type="checkbox" id="eqToggle" class="tgl" role="switch" aria-label="Activer l'égaliseur">
    </div>
    <div id="eqBody"></div>
  </div>
</section>

<div id="layer" hidden>
  <div id="sheetBg"></div>
  <div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
</div>

<audio id="audio" preload="auto"></audio>

      im.onload = function(){
        var s = Math.min(im.naturalWidth, im.naturalHeight), sx = (im.naturalWidth-s)/2, sy = (im.naturalHeight-s)/2;
        var c = document.createElement('canvas'); c.width = c.height = size;
        c.getContext('2d').drawImage(im, sx, sy, s, s, 0, 0, size, size);
        URL.revokeObjectURL(u);
        try{ res(c.toDataURL('image/jpeg', 0.82)); }catch(e){ rej(e); }
      };
      im.onerror = function(){ URL.revokeObjectURL(u); rej(new Error('img')); };
      im.src = u;
    });
  }

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmt(s){if(!isFinite(s)||s<0)s=0;var m=Math.floor(s/60),r=Math.floor(s%60);return m+':'+(r<10?'0':'')+r}
  function hue(str){var h=0;for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))%360;return h}
  function gradOf(key){var h=hue(key);return 'linear-gradient(135deg,hsl('+h+',70%,48%),hsl('+((h+50)%360)+',75%,38%))'}
  function grad(t){return gradOf(t.title+t.artist)}
  function coverImg(t){return t.cover || settings.defCover || ''}
  function bgOf(t){var im = coverImg(t); return im ? "url('"+im+"') center/cover no-repeat" : grad(t)}
  function letterOf(t){return coverImg(t) ? '' : initial(t)}
  function letterRaw(t){return coverImg(t) ? '' : t.title.charAt(0).toUpperCase()}
  function initial(t){return esc((t.title||'?').trim().charAt(0).toUpperCase()||'?')}
  function parseId(raw){return isNaN(Number(raw)) ? raw : Number(raw)}
  function baseKey(name){return name.replace(/\.[^.]+$/,'').trim().toLowerCase()}

  /* ---------- Stockage (IndexedDB) ---------- */
  function req(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
  function openDB(){
    return new Promise(function(res,rej){
      try{
        var r = indexedDB.open('ma-musique',2);
        r.onupgradeneeded = function(){
          var d = r.result;
          if(!d.objectStoreNames.contains('tracks')) d.createObjectStore('tracks',{keyPath:'id',autoIncrement:true});
          if(!d.objectStoreNames.contains('playlists')) d.createObjectStore('playlists',{keyPath:'id',autoIncrement:true});
        };
        r.onsuccess = function(){res(r.result)};
        r.onerror = function(){rej(r.error)};
      }catch(e){rej(e)}
    });
  }
  function st(name,mode){return db.transaction(name,mode).objectStore(name)}
  function showNotice(msg, sticky){
    var n = $('#notice'); clearTimeout(noticeTimer);
    n.textContent = msg; n.hidden = !msg;
    if(msg && !sticky) noticeTimer = setTimeout(function(){n.hidden = true}, 7000);
  }
  async function persist(t){ if(db && typeof t.id==='number'){ try{ await req(st('tracks','readwrite').put(t)); }catch(e){} } }
  async function persistPl(p){ if(db && typeof p.id==='number'){ try{ await req(st('playlists','readwrite').put(p)); }catch(e){} } }

  async function init(){
    try{
      db = await openDB();
      tracks = await req(st('tracks','readonly').getAll());
      playlists = await req(st('playlists','readonly').getAll());
    }catch(e){
      db = null; memOnly = true;
      showNotice("Le stockage du navigateur n'est pas disponible : tes titres et playlists seront perdus à la fermeture de la page.", true);
    }
    render();
  }

  /* ---------- Lecture des infos intégrées aux MP3 (ID3v2) ---------- */
  function syncsafe(b,i){return ((b[i]&127)<<21)|((b[i+1]&127)<<14)|((b[i+2]&127)<<7)|(b[i+3]&127)}
  function decodeText(enc, bytes){
    var label = 'utf-8';
    if(enc===0) label = 'windows-1252';
    else if(enc===1){
      if(bytes[0]===0xFE && bytes[1]===0xFF){label='utf-16be'; bytes=bytes.subarray(2)}
      else if(bytes[0]===0xFF && bytes[1]===0xFE){label='utf-16le'; bytes=bytes.subarray(2)}
      else label='utf-16le';
    }else if(enc===2) label='utf-16be';
    var s = '';
    try{ s = new TextDecoder(label).decode(bytes); }catch(e){ s = ''; }
    return s.replace(/\u0000+$/,'').replace(/\r\n?/g,'\n');
  }
  function skipTerm(d,i,enc){
    if(enc===0||enc===3){ while(i<d.length && d[i]!==0) i++; return i+1; }
    while(i+1<d.length && !(d[i]===0 && d[i+1]===0)) i+=2;
    return i+2;
  }
  async function readTags(f){
    var out = {};
    try{
      var head = new Uint8Array(await f.slice(0,10).arrayBuffer());
      if(head[0]!==0x49 || head[1]!==0x44 || head[2]!==0x33) return out;
      var ver = head[3], size = syncsafe(head,6);
      if(ver<3 || size>16*1024*1024) return out;
      var buf = new Uint8Array(await f.slice(10,10+size).arrayBuffer()), p = 0;
      if(head[5] & 0x40){
        p = ver===4 ? syncsafe(buf,0) : (((buf[0]<<24)|(buf[1]<<16)|(buf[2]<<8)|buf[3])+4);
      }
      while(p+10<=buf.length){
        var id = String.fromCharCode(buf[p],buf[p+1],buf[p+2],buf[p+3]);
        if(!/^[A-Z0-9]{4}$/.test(id)) break;
        var fs = ver===4 ? syncsafe(buf,p+4) : ((buf[p+4]<<24)|(buf[p+5]<<16)|(buf[p+6]<<8)|buf[p+7]);
        if(fs<=0 || p+10+fs>buf.length) break;
        var d = buf.subarray(p+10,p+10+fs);
        if(id==='TIT2') out.title = decodeText(d[0], d.subarray(1)).trim();
        else if(id==='TPE1') out.artist = decodeText(d[0], d.subarray(1)).trim();
        else if(id==='USLT' && !out.lyrics){
          var enc = d[0], i = skipTerm(d,4,enc);
          out.lyrics = decodeText(enc, d.subarray(i)).trim();
        }
        p += 10+fs;
      }
    }catch(e){}
    return out;
  }

  /* ---------- Import ---------- */
  function getDuration(f){
    return new Promise(function(res){
      var a = new Audio(), u = URL.createObjectURL(f);
      a.preload = 'metadata';
      a.onloadedmetadata = function(){res(isFinite(a.duration)?a.duration:0);URL.revokeObjectURL(u)};
      a.onerror = function(){res(0);URL.revokeObjectURL(u)};
      a.src = u;
    });
  }
  async function importFiles(files){
    var audioFiles = [], texts = {}, textCount = 0, added = 0, lyricsSet = 0;
    for(var i=0;i<files.length;i++){
      var f = files[i];
      if(/\.(lrc|txt)$/i.test(f.name)){
        try{ texts[baseKey(f.name)] = (await f.text()).replace(/\r\n?/g,'\n'); textCount++; }catch(e){}
      }else if(/^(audio|video)\//.test(f.type) || !f.type || /\.(mp3|m4a|aac|wav|ogg|opus|flac|aiff|aif|mp4|webm|weba|mpga|caf)$/i.test(f.name)){
        audioFiles.push(f);
      }
    }
    for(var j=0;j<audioFiles.length;j++){
      var af = audioFiles[j];
      var base = af.name.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim();
      var artist = '', title = base, k = base.indexOf(' - ');
      if(k>0){artist = base.slice(0,k).trim(); title = base.slice(k+3).trim();}
      var tags = await readTags(af);
      var key = baseKey(af.name);
      var t = {
        title: tags.title || title, artist: tags.artist || artist, blob: af, fav: false,
        added: Date.now()+j, duration: 0, src: key, ext: (af.name.match(/\.([A-Za-z0-9]+)$/)||['',''])[1].toLowerCase(),
        lyrics: tags.lyrics || texts[key] || ''
      };
      if(t.lyrics) lyricsSet++;
      if(db){
        try{ t.id = await req(st('tracks','readwrite').add(t)); }
        catch(e){ t.id = 'm'+(nextId++); showNotice("Impossible d'enregistrer certains titres sur cet appareil (espace insuffisant ?). Ils restent disponibles jusqu'à la fermeture de la page.", true); }
      }else{ t.id = 'm'+(nextId++); }
      tracks.push(t); added++;
    }
    if(textCount){
      for(var key2 in texts){
        for(var n=0;n<tracks.length;n++){
          if(tracks[n].src===key2 && tracks[n].lyrics!==texts[key2]){ tracks[n].lyrics = texts[key2]; persist(tracks[n]); lyricsSet++; break; }
        }
      }
    }
    if(!added && !textCount) showNotice("Aucun fichier reconnu. Formats acceptés : MP3, M4A, AAC, WAV, OGG, FLAC.", true);
    else if(added) showNotice(added+(added>1?' titres ajoutés':' titre ajouté')+(lyricsSet?', avec paroles pour '+lyricsSet+'.':'.'));
    else if(lyricsSet) showNotice(lyricsSet+(lyricsSet>1?' titres ont des paroles.':' titre a des paroles.'));
    else if(textCount && !added) showNotice("Aucun titre ne porte le même nom que ces fichiers de paroles. Renomme le fichier .lrc comme le fichier audio.");
    render();
    if(lyricsOpen) renderLyrics();
  }

  /* ---------- Playlists ---------- */
  function plById(id){for(var i=0;i<playlists.length;i++) if(playlists[i].id===id) return playlists[i]; return null}
  async function createPl(name){
    var p = {name:(name||'').trim().slice(0,60) || 'Nouvelle playlist', ids:[], added:Date.now()};
    if(db){ try{ p.id = await req(st('playlists','readwrite').add(p)); }catch(e){ p.id = 'p'+(nextId++); } }
    else p.id = 'p'+(nextId++);

    return p;

  /* ---------- Liste ---------- */
  function byId(id){for(var i=0;i<tracks.length;i++) if(tracks[i].id===id) return tracks[i]; return null}

      '</li>';
    }).join('');

    if(!list.length){

      }else if(!tracks.length){

      }else if(view==='fav' && !q){

      }else{

      }
    }else empty.hidden = true;

  /* ---------- Paroles ---------- */
  function parseLyrics(raw){
    var timed = [], plain = [];
    (raw||'').split('\n').forEach(function(l){
      var re = /\[(\d{1,3}):(\d{2}(?:[.:]\d{1,3})?)\]/g, m, times = [], last = 0;
      while((m = re.exec(l))){ times.push(parseInt(m[1],10)*60 + parseFloat(m[2].replace(':','.'))); last = re.lastIndex; }
      if(times.length){
        var text = l.slice(last).trim();
        times.forEach(function(tt){timed.push({t:tt, text:text})});
      }else if(!/^\[[a-zA-Z]{2,}:.*\]\s*$/.test(l.trim())){
        plain.push(l.trim());
      }
    });
    if(timed.length>=2){ timed.sort(function(a,b){return a.t-b.t}); return {synced:true, lines:timed}; }
    while(plain.length && !plain[0]) plain.shift();
    while(plain.length && !plain[plain.length-1]) plain.pop();
    return {synced:false, lines:plain};
  }
  function renderLyrics(){
    var box = $('#lyrics'), t = byId(cur);
    $('#disc').hidden = lyricsOpen;
    box.hidden = !lyricsOpen;
    $('#lyrBtn').innerHTML = ICONS.lines;
    $('#lyrBtn').classList.toggle('on', lyricsOpen);
    lyr = null; lyrIdx = -1;
    if(!lyricsOpen || !t) return;
    if(!t.lyrics || !t.lyrics.trim()){
      box.innerHTML = '<div class="none">Pas de paroles pour ce titre.<br>Colle-les, ou importe un fichier .lrc ou .txt.<br><button class="pill" type="button" data-act="editlyr">Ajouter les paroles</button></div>';
      return;
    }
    lyr = parseLyrics(t.lyrics);
    if(lyr.synced){
      box.innerHTML = lyr.lines.map(function(l,i){return '<p class="ln seekable" data-i="'+i+'">'+(esc(l.text)||'&nbsp;')+'</p>'}).join('');
    }else{
      box.innerHTML = lyr.lines.map(function(l){return '<p class="plain">'+(esc(l)||'&nbsp;')+'</p>'}).join('') +
        '<div class="srow" style="justify-content:center;margin-top:12px"><button class="ghost" type="button" data-act="editlyr">Modifier les paroles</button></div>';
    }
    box.scrollTop = 0;
    syncLyrics(true);
  }
  function syncLyrics(force){
    if(!lyricsOpen || !lyr || !lyr.synced) return;
    var ct = audio.currentTime + 0.25, idx = -1;
    for(var i=0;i<lyr.lines.length;i++){ if(lyr.lines[i].t<=ct) idx = i; else break; }
    if(idx===lyrIdx && !force) return;
    lyrIdx = idx;
    var box = $('#lyrics'), nodes = box.querySelectorAll('.ln');
    nodes.forEach(function(n,i){n.classList.toggle('on', i===idx)});
    if(idx>=0 && nodes[idx]){
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var top = nodes[idx].offsetTop - box.clientHeight/2 + nodes[idx].clientHeight/2;
      try{ box.scrollTo({top:Math.max(0,top), behavior: reduce?'auto':'smooth'}); }catch(e){ box.scrollTop = Math.max(0,top); }
    }
  }

    $('#shuffleBtn').innerHTML = ICONS.shuffle; $('#shuffleBtn').classList.toggle('on', shuffle);
    $('#repeatBtn').innerHTML = ICONS.repeat + (repeat===2?'<i>1</i>':''); $('#repeatBtn').classList.toggle('on', repeat>0);
    $('#tDur').textContent = fmt(audio.duration || t.duration);
    if('mediaSession' in navigator){navigator.mediaSession.playbackState = playing ? 'playing' : 'paused'}
  }

  function play(id){
    var t = byId(id); if(!t) return;
    cur = id;
    if(objUrl) URL.revokeObjectURL(objUrl);
    var blob = t.blob;
    if(!blob.type || blob.type==='application/octet-stream') blob = new Blob([blob], {type: MIMES[t.ext] || 'audio/mpeg'});
    objUrl = URL.createObjectURL(blob);
    audio.src = objUrl;
    if(actx || eqActive()) ensureGraph();
    audio.playbackRate = settings.speed;
    audio.play().catch(function(){});
    if('mediaSession' in navigator){
      try{navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:t.artist||'Ma Musique'})}catch(e){}
    }
    render();
    renderLyrics();
  }
  function step(dir, auto){
    var list = visible(); if(!list.length) return;
    var i = list.findIndex(function(t){return t.id===cur});
    if(shuffle && list.length>1){
      var j; do{ j = Math.floor(Math.random()*list.length) }while(j===i);
      return play(list[j].id);
    }
    var n = i + dir;
    if(n>=list.length || n<0){
      if(auto && repeat===0 && dir>0){ audio.pause(); renderPlayer(); return }
      n = (n+list.length) % list.length;
    }
    play(list[n].id);
  }
  function toggle(){
    if(!byId(cur)){var l=visible(); if(l.length) play(l[0].id); return}
    if(audio.paused) audio.play().catch(function(){}); else audio.pause();
  }
  function toggleFav(id){
    var t = byId(id); if(!t) return;
    t.fav = !t.fav; persist(t); render();
  }
  async function remove(id){
    var t = byId(id); if(!t) return;
    if(db && typeof id === 'number'){ try{ await req(st('tracks','readwrite').delete(id)); }catch(e){} }
    tracks = tracks.filter(function(x){return x.id!==id});
    playlists.forEach(function(p){var k = p.ids.indexOf(id); if(k>=0){p.ids.splice(k,1); persistPl(p)}});
    if(cur===id){ audio.pause(); audio.removeAttribute('src'); audio.load(); cur = null; lyricsOpen = false; renderLyrics(); }
    render();
  }

    }else if(sh.type==='newpl'){
      h = '<h3>Nouvelle playlist</h3>'+
        '<input class="field" id="newName" maxlength="60" placeholder="Nom de la playlist" aria-label="Nom de la playlist">'+
        '<div class="srow"><button class="pill" data-s="create" type="button">Créer</button><button class="ghost" data-s="close" type="button">Annuler</button></div>';
    }else if(sh.type==='pl'){
      p = plById(sh.id); if(!p) return closeSheet();
      h = '<h3>Modifier la playlist</h3>'+
        '<input class="field" id="plName" maxlength="60" value="'+esc(p.name)+'" aria-label="Nom de la playlist">'+
        '<div class="srow"><button class="pill" data-s="rename" type="button">Enregistrer le nom</button><button class="ghost" data-s="close" type="button">Annuler</button></div>'+
        '<button class="sbtn danger" data-s="pldel" type="button" style="margin-top:12px">'+(sh.armed?'Confirmer la suppression':'Supprimer la playlist')+'</button>';
    }else if(sh.type==='settings'){
      h = settingsHtml();
    }else if(sh.type==='lyrics'){
      t = byId(sh.id); if(!t) return closeSheet();
      h = '<h3>Paroles : '+esc(t.title)+'</h3>'+
        '<p class="hint">Colle les paroles, ou importe un fichier .lrc (avec horodatage, elles défilent avec la musique) ou .txt. Les paroles intégrées aux fichiers MP3 sont lues automatiquement à l\'ajout.</p>'+
        '<textarea class="field" id="lyrText" aria-label="Paroles">'+esc(t.lyrics||'')+'</textarea>'+
        '<div class="srow"><button class="pill" data-s="lsave" type="button">Enregistrer</button>'+
        '<button class="ghost" data-s="limport" type="button">Importer un fichier</button>'+
        '<button class="ghost" data-s="lclear" type="button">Effacer</button>'+
        '<button class="ghost" data-s="close" type="button">Annuler</button></div>';
    }
    body.innerHTML = h;
    if(sh.type==='newpl' || sh.type==='pl'){
      setTimeout(function(){var i = $('#plName') || $('#newName'); if(i) i.focus()}, 50);
    }
  }
  $('#sheetBg').addEventListener('click', closeSheet);
  $('#sheet').addEventListener('input', function(e){
    var el = e.target;
    if(el.id==='speedR'){
      settings.speed = parseFloat(el.value);
      $('#speedV').textContent = speedTxt();
      audio.playbackRate = settings.speed; audio.defaultPlaybackRate = settings.speed;
      saveSettings();
    }
  });
  $('#sheet').addEventListener('change', function(e){
    if(e.target.id==='spinChk'){ settings.spin = e.target.checked; saveSettings(); applySettings(); }
  });
  $('#imgFile').addEventListener('change', async function(e){
    var f = e.target.files && e.target.files[0]; e.target.value = '';
    if(!f || !imgTarget) return;
    var target = imgTarget, url;
    try{ url = await squareImage(f, target.kind==='logo' ? 192 : 512); }
    catch(err){ showNotice("Cette image n'a pas pu être lue. Essaie un fichier JPG ou PNG."); return; }
    if(target.kind==='track'){ var t = byId(target.id); if(t){ t.cover = url; persist(t); } }
    else if(target.kind==='logo'){ settings.logo = url; saveSettings(); applySettings(); }
    else if(target.kind==='def'){ settings.defCover = url; saveSettings(); }
    imgTarget = null;
    if(sh && sh.type==='settings') renderSheet(); else closeSheet();
    render();
  });
  $('#sheet').addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.tagName==='INPUT'){
      e.preventDefault();
      var b = sh && (sh.type==='pick' ? '[data-s="createadd"]' : sh.type==='newpl' ? '[data-s="create"]' : '[data-s="rename"]');
      var el = b && $('#sheet '+b); if(el) el.click();
    }
  });
  $('#sheet').addEventListener('click', async function(e){
    var el = e.target.closest('[data-s]'); if(!el || !sh) return;
    var a = el.dataset.s, t, p, name;
    if(a==='close') return closeSheet();
    if(a==='theme'){ settings.theme = el.dataset.v; saveSettings(); applySettings(); return renderSheet(); }
    if(a==='accent'){ settings.accent = el.dataset.v; saveSettings(); applySettings(); return renderSheet(); }
    if(a==='openeq'){ closeSheet(); return openEq(); }
    if(a==='sleep'){ setSleep(Number(el.dataset.v)); return renderSheet(); }
    if(a==='lsize'){ settings.lyrSize = el.dataset.v; saveSettings(); applySettings(); return renderSheet(); }
    if(a==='pstyle'){ settings.style = el.dataset.v; saveSettings(); renderSheet(); return renderPlayer(); }
    if(a==='speedreset'){ settings.speed = 1; saveSettings(); applySettings(); return renderSheet(); }
    if(a==='plogo'){ imgTarget = {kind:'logo'}; return $('#imgFile').click(); }
    if(a==='rlogo'){ settings.logo = ''; saveSettings(); applySettings(); return renderSheet(); }
    if(a==='pdef'){ imgTarget = {kind:'def'}; return $('#imgFile').click(); }
    if(a==='rdef'){ settings.defCover = ''; saveSettings(); renderSheet(); return render(); }
    if(a==='cover'){ imgTarget = {kind:'track', id:sh.id}; return $('#imgFile').click(); }
    if(a==='uncover'){ t = byId(sh.id); if(t){ delete t.cover; persist(t); } closeSheet(); return render(); }
    if(a==='reset'){
      if(!sh.armed){ sh.armed = true; return renderSheet(); }
      settings = freshSettings(); if(!$('#eq').hidden) renderEq();
      setSleep(0); saveSettings(); applySettings(); applyEq();
      sh.armed = false; renderSheet(); return render();
    }
    if(a==='pick') return openSheet({type:'pick', id:sh.id});
    if(a==='fav'){ toggleFav(sh.id); return closeSheet(); }
    if(a==='lyrics') return openSheet({type:'lyrics', id:sh.id});
    if(a==='unpl'){
      p = plById(plId);
      if(p){ var k = p.ids.indexOf(sh.id); if(k>=0){p.ids.splice(k,1); persistPl(p)} }
      closeSheet(); return render();
    }
    if(a==='del'){
      if(!sh.armed){ sh.armed = true; return renderSheet(); }
      var did = sh.id; closeSheet(); return remove(did);
    }
    if(a==='tog'){
      p = plById(parseId(el.dataset.pid)); if(p) togglePl(p, sh.id);
      renderSheet(); return render();
    }
    if(a==='createadd'){
      name = $('#newName').value;
      p = await createPl(name); togglePl(p, sh.id);
      renderSheet(); return render();
    }
    if(a==='create'){
      await createPl($('#newName').value); closeSheet(); return render();
    }
    if(a==='rename'){
      p = plById(sh.id); name = $('#plName').value.trim().slice(0,60);
      if(p && name){ p.name = name; persistPl(p); }
      closeSheet(); return render();
    }
    if(a==='pldel'){
      if(!sh.armed){ sh.armed = true; return renderSheet(); }
      var pid = sh.id;
      if(db && typeof pid==='number'){ try{ await req(st('playlists','readwrite').delete(pid)); }catch(err){} }
      playlists = playlists.filter(function(x){return x.id!==pid});
      if(plId===pid) plId = null;
      closeSheet(); return render();
    }
    if(a==='lsave'){
      t = byId(sh.id); if(t){ t.lyrics = $('#lyrText').value; persist(t); }
      closeSheet(); renderLyrics(); return render();
    }
    if(a==='lclear'){
      t = byId(sh.id); if(t){ t.lyrics = ''; persist(t); }
      closeSheet(); renderLyrics(); return render();
    }
    if(a==='limport') return $('#lrcFile').click();
  });
  $('#lrcFile').addEventListener('change', async function(e){
    var f = e.target.files && e.target.files[0]; e.target.value = '';
    if(!f) return;
    try{
      var txt = (await f.text()).replace(/\r\n?/g,'\n');
      var ta = $('#lyrText'); if(ta) ta.value = txt;
    }catch(err){}
  });

  /* ---------- Événements ---------- */
  $('#addBtn').addEventListener('click', function(){$('#file').click()});
  $('#gearBtn').innerHTML = ICONS.sliders;
  $('#gearBtn').addEventListener('click', function(){openSheet({type:'settings'})});
  $('#file').addEventListener('change', function(e){
    var files = Array.prototype.slice.call(e.target.files||[]);
    e.target.value = '';
    if(files.length) importFiles(files);
  });
  $('#search').addEventListener('input', function(e){q = e.target.value; render()});
  document.querySelectorAll('.tabs button[data-view]').forEach(function(b){
    b.addEventListener('click', function(){
      view = b.dataset.view; plId = null;
      render();
    });
  });
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]'); if(!el) return;
    var act = el.dataset.act;
    if(act==='add') return $('#file').click();
    if(act==='back'){ plId = null; return render(); }
    if(act==='newpl') return openSheet({type:'newpl'});
    if(act==='editlyr'){ if(cur!==null) openSheet({type:'lyrics', id:cur}); return; }
    var row = el.closest('.row');
    if(act==='plmore'){
      var pid = row && row.dataset.pid ? parseId(row.dataset.pid) : plId;
      if(pid!==null) openSheet({type:'pl', id:pid});
      return;
    }
    if(act==='openpl' && row){ plId = parseId(row.dataset.pid); q = ''; $('#search').value = ''; return render(); }
    if(!row) return;
    var id = parseId(row.dataset.id);
    if(act==='play') play(id);
    else if(act==='fav') toggleFav(id);
    else if(act==='more') openSheet({type:'track', id:id});
  });
  $('#miniPlay').addEventListener('click', toggle);
  $('#miniOpen').addEventListener('click', function(){$('#full').hidden = false; renderPlayer(); renderLyrics()});
  $('#closeFull').addEventListener('click', function(){$('#full').hidden = true});
  $('#lyrBtn').addEventListener('click', function(){lyricsOpen = !lyricsOpen; renderLyrics()});
  $('#lyrics').addEventListener('click', function(e){
    var ln = e.target.closest('.ln.seekable');
    if(ln && lyr && lyr.synced){ audio.currentTime = lyr.lines[Number(ln.dataset.i)].t; syncLyrics(true); }
  });
  $('#playBtn').addEventListener('click', toggle);
  $('#prevBtn').addEventListener('click', function(){ if(audio.currentTime>3){audio.currentTime=0} else step(-1,false) });
  $('#nextBtn').addEventListener('click', function(){step(1,false)});
  $('#shuffleBtn').addEventListener('click', function(){shuffle=!shuffle; renderPlayer()});
  $('#repeatBtn').addEventListener('click', function(){repeat=(repeat+1)%3; renderPlayer()});
  $('#favFull').addEventListener('click', function(){ if(cur!==null) toggleFav(cur) });

  var seek = $('#seek');
  seek.addEventListener('input', function(){
    dragging = true;
    if(audio.duration) $('#tCur').textContent = fmt(seek.value/1000*audio.duration);
  });
  seek.addEventListener('change', function(){
    if(audio.duration) audio.currentTime = seek.value/1000*audio.duration;
    dragging = false;
  });

  audio.addEventListener('timeupdate', function(){
    var d = audio.duration || 0;
    $('#miniBar').style.width = d ? (audio.currentTime/d*100)+'%' : '0';
    if(!dragging){
      $('#tCur').textContent = fmt(audio.currentTime);
      seek.value = d ? Math.round(audio.currentTime/d*1000) : 0;
    }
    syncLyrics(false);
  });
  audio.addEventListener('seeked', function(){syncLyrics(false)});
  audio.addEventListener('loadedmetadata', function(){
    $('#tDur').textContent = fmt(audio.duration);
    var ct = byId(cur);
    if(ct && isFinite(audio.duration) && Math.abs((ct.duration||0) - audio.duration) > 1){ ct.duration = audio.duration; persist(ct); render(); }
  });
  audio.addEventListener('play', renderPlayer);
  audio.addEventListener('pause', renderPlayer);
  audio.addEventListener('ended', function(){
    if(repeat===2){ audio.currentTime = 0; audio.play().catch(function(){}); }
    else step(1,true);
  });
  audio.addEventListener('error', function(){
    if(cur!==null) showNotice("Ce fichier n'a pas pu être lu par ton téléphone. Vérifie qu'il s'agit bien d'un MP3 ou M4A complet, ou retélécharge-le.", true);
  });

  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play', function(){audio.play()});
      navigator.mediaSession.setActionHandler('pause', function(){audio.pause()});
      navigator.mediaSession.setActionHandler('previoustrack', function(){step(-1,false)});
      navigator.mediaSession.setActionHandler('nexttrack', function(){step(1,false)});
    }catch(e){}
  }

  /* ---------- Écran égaliseur ---------- */
  function openEq(){ $('#eq').hidden = false; renderEq(); }
  function closeEq(){ $('#eq').hidden = true; }
  function bandPos(v){return (12-v)/24*100}
  function allPresets(){
    return PRESETS.map(function(p){return {name:p[0], eq:p[1], custom:false}})
      .concat(settings.custom.map(function(c){return {name:c.name, eq:c.eq, custom:true}}));
  }
  function presetChips(){
    var cs = [{name:'Perso'}].concat(allPresets());
    return cs.map(function(c){
      return '<button type="button" data-e="preset" data-v="'+esc(c.name)+'" class="'+(settings.preset===c.name?'on':'')+'">'+esc(c.name)+'</button>';
    }).join('');
  }
  function enableEq(){
    if(settings.eqOn) return;
    settings.eqOn = true; $('#eqToggle').checked = true; $('#eq').classList.remove('off');
  }
  function renderEq(){
    var s = settings;
    $('#eqToggle').checked = !!s.eqOn;
    $('#eq').classList.toggle('off', !s.eqOn);
    $('#eqClose').innerHTML = ICONS.down;
    var bands = EQ_LAB.map(function(l,i){
      var v = s.eq[i], p = bandPos(v);
      return '<div class="eqb"><span id="ev'+i+'">'+v.toFixed(1)+'</span>'+
        '<div class="trk" data-b="'+i+'" role="slider" aria-label="'+l+' Hz" aria-valuemin="-12" aria-valuemax="12" aria-valuenow="'+v+'">'+
        '<div class="fill" style="top:'+Math.min(p,50)+'%;height:'+Math.abs(p-50)+'%"></div><div class="zero"></div>'+
        '<div class="thumb" style="top:'+p+'%"></div></div><span>'+l+'</span></div>';
    }).join('');
    var isCustom = s.custom.some(function(c){return c.name===s.preset});
    $('#eqBody').innerHTML =
      '<div class="eqbands">'+bands+'</div>'+
      '<div class="sechead"><h3>Préconfigurations</h3><button class="outline" type="button" data-e="savebtn">Enregistrer le préréglage</button></div>'+
      '<div class="saverow" id="saveRow" hidden><input class="field" id="presetName" maxlength="24" placeholder="Nom du préréglage" aria-label="Nom du préréglage"><button class="pill" type="button" data-e="savego">Enregistrer</button></div>'+
      '<div class="chips" id="eqPresets">'+presetChips()+'</div>'+
      (isCustom ? '<div class="srow"><button class="ghost" type="button" data-e="delpreset">Supprimer ce préréglage</button></div>' : '')+
      '<div class="sechead"><h3>Réverbération</h3></div>'+
      '<div class="chips">'+REVERBS.map(function(r){
        return '<button type="button" data-e="rv" data-v="'+r[0]+'" class="'+(s.reverb===r[0]?'on':'')+'">'+r[1]+'</button>';
      }).join('')+'</div>'+
      '<div class="card"><div class="cardhead"><span>Préampli</span><span id="preV">'+dbTxt(s.pre)+'</span></div>'+
        '<input type="range" id="preR" min="-12" max="12" step="0.5" value="'+s.pre+'" aria-label="Préampli"></div>'+
      '<div class="card"><div class="cardhead"><span>Renforcement des basses</span><span id="bassV">'+dbTxt(s.bass)+'</span></div>'+
        '<input type="range" id="bassR" min="0" max="12" step="0.5" value="'+s.bass+'" aria-label="Renforcement des basses"></div>';
  }
  function updateBand(i){
    var trk = document.querySelector('#eqBody .trk[data-b="'+i+'"]'); if(!trk) return;
    var v = settings.eq[i], p = bandPos(v), f = trk.querySelector('.fill');
    f.style.top = Math.min(p,50)+'%'; f.style.height = Math.abs(p-50)+'%';
    trk.querySelector('.thumb').style.top = p+'%';
    trk.setAttribute('aria-valuenow', v);
    $('#ev'+i).textContent = v.toFixed(1);
  }
  var eqDrag = null;
  function moveBand(e){
    var r = eqDrag.getBoundingClientRect();
    var v = 12 - (e.clientY - r.top)/r.height*24;
    v = Math.max(-12, Math.min(12, Math.round(v*2)/2));
    var i = Number(eqDrag.dataset.b);
    if(settings.eq[i]===v && settings.eqOn) return;
    settings.eq[i] = v; settings.preset = 'Perso';
    enableEq(); updateBand(i);
    var pc = $('#eqPresets'); if(pc) pc.innerHTML = presetChips();
    var d = $('#eqBody [data-e="delpreset"]'); if(d && d.parentNode) d.parentNode.remove();
    applyEq(); saveSettings();
  }
  $('#eqBtn').addEventListener('click', openEq);
  $('#eqClose').addEventListener('click', closeEq);
  $('#eqToggle').addEventListener('change', function(e){
    settings.eqOn = e.target.checked;
    $('#eq').classList.toggle('off', !settings.eqOn);
    applyEq(); saveSettings();
  });
  $('#eqBody').addEventListener('pointerdown', function(e){
    var trk = e.target.closest('.trk'); if(!trk) return;
    eqDrag = trk;
    try{ trk.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault(); moveBand(e);
  });
  $('#eqBody').addEventListener('pointermove', function(e){ if(eqDrag) moveBand(e); });
  ['pointerup','pointercancel'].forEach(function(n){ $('#eqBody').addEventListener(n, function(){ eqDrag = null; }); });
  $('#eqBody').addEventListener('click', function(e){
    var el = e.target.closest('[data-e]'); if(!el) return;
    var a = el.dataset.e;
    if(a==='preset'){
      var name = el.dataset.v; if(name==='Perso') return;
      var found = allPresets().filter(function(p){return p.name===name})[0]; if(!found) return;
      settings.eq = found.eq.slice(); settings.preset = name; settings.eqOn = true;
      if(found.custom){
        var c = settings.custom.filter(function(x){return x.name===name})[0];
        if(c){ settings.bass = c.bass; settings.pre = c.pre; settings.reverb = c.reverb; }
      }
      applyEq(); saveSettings(); renderEq();
    }else if(a==='rv'){
      settings.reverb = el.dataset.v; settings.eqOn = true;
      applyEq(); saveSettings(); renderEq();
    }else if(a==='savebtn'){
      var row = $('#saveRow'); row.hidden = !row.hidden;
      if(!row.hidden) $('#presetName').focus();
    }else if(a==='savego'){
      var nm = $('#presetName').value.trim().slice(0,24); if(!nm) return;
      if(nm==='Perso' || PRESETS.some(function(p){return p[0]===nm})) nm += ' 2';
      settings.custom = settings.custom.filter(function(x){return x.name!==nm});
      settings.custom.push({name:nm, eq:settings.eq.slice(), bass:settings.bass, pre:settings.pre, reverb:settings.reverb});
      settings.preset = nm; saveSettings(); renderEq();
    }else if(a==='delpreset'){
      settings.custom = settings.custom.filter(function(x){return x.name!==settings.preset});
      settings.preset = 'Perso'; saveSettings(); renderEq();
    }
  });
  $('#eqBody').addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.id==='presetName'){ e.preventDefault(); var b = $('#eqBody [data-e="savego"]'); if(b) b.click(); }
  });
  $('#eqBody').addEventListener('input', function(e){
    if(e.target.id==='preR'){
      settings.pre = parseFloat(e.target.value); $('#preV').textContent = dbTxt(settings.pre);
      enableEq(); applyEq(); saveSettings();
    }else if(e.target.id==='bassR'){
      settings.bass = parseFloat(e.target.value); $('#bassV').textContent = dbTxt(settings.bass);
      enableEq(); applyEq(); saveSettings();
    }
  });

  applySettings();
  init();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
